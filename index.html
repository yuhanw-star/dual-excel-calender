<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实验室预约管理</title>
  <style>
:root {
  --ink: #17212b;
  --muted: #607080;
  --line: #d7e1ea;
  --blue: #1f5d8c;
  --blue-soft: #e6f1f8;
  --green: #2f7d57;
  --green-soft: #e8f5ed;
  --orange-soft: #fff0e6;
  --red: #b93b3b;
  --red-soft: #fde8e8;
  --bg: #f7f9fb;
  --panel: #ffffff;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
}
.app {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  padding: 22px 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
}
h1, h2, p { margin: 0; }
h1 { font-size: 28px; }
h2 { font-size: 18px; }
p { color: var(--muted); margin-top: 8px; }
.file-button, button {
  border: 0;
  border-radius: 6px;
  background: var(--blue);
  color: white;
  padding: 11px 16px;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
.file-button input { display: none; }
.ghost {
  color: var(--blue);
  background: var(--blue-soft);
}
.status-band {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 16px 0;
}
.import-error {
  display: none;
  margin-top: 12px;
  padding: 12px 14px;
  border: 1px solid #efb7b7;
  border-radius: 8px;
  color: var(--red);
  background: var(--red-soft);
}
.import-error.show { display: block; }
.status-band > div, .panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.status-band > div { padding: 14px 16px; }
.label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 5px;
}
.workbench {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: 16px;
}
.panel { padding: 18px; min-width: 0; }
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.hint { color: var(--red); font-size: 13px; }
.form-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(120px, 1fr));
  gap: 12px;
}
label {
  display: grid;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}
input, select {
  width: 100%;
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0 10px;
  color: var(--ink);
  background: white;
  font-size: 14px;
}
.wide-label { margin-top: 12px; }
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.table-wrap {
  overflow: auto;
  max-height: 266px;
  border: 1px solid var(--line);
  border-radius: 6px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th, td {
  border-bottom: 1px solid var(--line);
  padding: 9px 10px;
  text-align: left;
  vertical-align: top;
}
th { background: var(--blue-soft); color: #21475f; position: sticky; top: 0; }
.tabs {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}
.tab {
  background: #e9eef3;
  color: var(--ink);
}
.tab.active { background: var(--blue); color: white; }
.calendar-tools {
  display: flex;
  gap: 14px;
  align-items: end;
  margin: 14px 0;
}
.calendar-tools label { width: 170px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(128px, 1fr));
  gap: 1px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--line);
}
.weekday, .day {
  background: white;
  min-height: 132px;
  padding: 10px;
}
.weekday {
  min-height: auto;
  color: white;
  background: var(--blue);
  text-align: center;
  font-weight: 700;
}
.day.outside { background: #f2f5f7; color: #98a4ae; }
.date-num {
  font-weight: 700;
  margin-bottom: 8px;
}
.slot, .appt {
  display: block;
  margin: 5px 0;
  padding: 5px 7px;
  border-radius: 5px;
  line-height: 1.25;
}
.slot { color: var(--green); background: var(--green-soft); }
.appt { color: #84420c; background: var(--orange-soft); }
.blocked {
  color: var(--muted);
  font-size: 13px;
}
.matrix {
  overflow: auto;
  max-height: 560px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.matrix table { min-width: 980px; }
.occupied { background: var(--red-soft); }
.available { background: var(--green-soft); }
.empty {
  padding: 40px;
  text-align: center;
  color: var(--muted);
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.linkish {
  color: var(--red);
  border: 0;
  background: transparent;
  padding: 0;
}
@media (max-width: 980px) {
  .topbar, .workbench { grid-template-columns: 1fr; display: grid; }
  .status-band { grid-template-columns: repeat(2, 1fr); }
  .form-grid { grid-template-columns: repeat(2, 1fr); }
  .calendar { grid-template-columns: repeat(7, minmax(108px, 1fr)); overflow-x: auto; }
}
@media (max-width: 640px) {
  .app { padding: 12px; }
  .status-band, .form-grid { grid-template-columns: 1fr; }
  .calendar-tools { flex-wrap: wrap; }
}

</style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>实验室预约管理</h1>
        <p>导入原始预约表后，可实时录入被试、查看可约时间，并导出预约信息或更新后的 Excel。</p>
      </div>
      <label class="file-button">
        <input id="fileInput" type="file" accept=".xlsx,.xls">
        导入 Excel
      </label>
    </header>
    <div id="importError" class="import-error" role="alert"></div>

    <section class="status-band">
      <div>
        <span class="label">当前文件</span>
        <strong id="fileName">未导入</strong>
      </div>
      <div>
        <span class="label">204BP 可识别日期</span>
        <strong id="count204">0</strong>
      </div>
      <div>
        <span class="label">503 可识别日期</span>
        <strong id="count503">0</strong>
      </div>
      <div>
        <span class="label">本页新增预约</span>
        <strong id="bookingCount">0</strong>
      </div>
    </section>

    <section class="workbench">
      <form id="bookingForm" class="panel">
        <div class="panel-head">
          <h2>录入预约</h2>
          <span id="conflictText" class="hint"></span>
        </div>
        <div class="form-grid">
          <label>姓名<input id="name" required autocomplete="off"></label>
          <label>分组
            <select id="group">
              <option>高焦虑组</option>
              <option>低焦虑组</option>
              <option selected>未分组</option>
            </select>
          </label>
          <label>年龄<input id="age" type="number" min="1" max="120"></label>
          <label>性别
            <select id="gender">
              <option>女</option>
              <option>男</option>
              <option>其他</option>
            </select>
          </label>
          <label>实验室
            <select id="lab">
              <option value="204BP">204BP</option>
              <option value="503">503</option>
            </select>
          </label>
          <label>日期<input id="date" type="date" required></label>
          <label>开始时间
            <select id="startHour"></select>
          </label>
          <label>时长
            <select id="duration">
              <option value="2">2 小时</option>
              <option value="3">3 小时</option>
            </select>
          </label>
        </div>
        <label class="wide-label">备注/联系方式<input id="note" autocomplete="off"></label>
        <div class="actions">
          <button type="submit">添加预约</button>
          <button id="exportBookings" type="button">导出预约信息 CSV</button>
          <button id="exportWorkbook" type="button">导出更新后 Excel</button>
        </div>
      </form>

      <section class="panel">
        <div class="panel-head">
          <h2>新增预约</h2>
          <button id="clearBookings" type="button" class="ghost">清空新增</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>姓名</th><th>分组</th><th>实验室</th><th>日期</th><th>时间</th><th>信息</th><th></th>
              </tr>
            </thead>
            <tbody id="bookingRows"></tbody>
          </table>
        </div>
      </section>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="availability">可约时间月历</button>
      <button class="tab" data-tab="appointments">预约信息月历</button>
      <button class="tab" data-tab="matrix">原表占用预览</button>
    </nav>

    <section class="calendar-tools">
      <label>月份<input id="monthPicker" type="month"></label>
      <label>实验室
        <select id="viewLab">
          <option value="204BP">204BP</option>
          <option value="503">503</option>
          <option value="all">全部</option>
        </select>
      </label>
      <label id="viewDurationWrap">时长
        <select id="viewDuration">
          <option value="2">2 小时</option>
          <option value="3">3 小时</option>
        </select>
      </label>
    </section>

    <section id="availability" class="tab-panel active">
      <div id="availabilityCalendar" class="calendar"></div>
    </section>
    <section id="appointments" class="tab-panel">
      <div id="appointmentsCalendar" class="calendar"></div>
    </section>
    <section id="matrix" class="tab-panel">
      <div id="matrixPreview" class="matrix"></div>
    </section>
  </main>

  <template id="emptyTemplate">
    <div class="empty">请先导入 Excel 文件。</div>
  </template>

  <script>
const state = {
  workbook: null,
  fileName: "",
  sheets: {
    "204BP": { name: "", rows: new Map(), slotStartCol: 2 },
    "503": { name: "", rows: new Map(), slotStartCol: 1 },
  },
  bookings: [],
};

const $ = (id) => document.getElementById(id);
const hours = Array.from({ length: 13 }, (_, i) => 8 + i);
const weekNames = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

function localISO(date) {
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0"),
  ].join("-");
}

function excelDateToISO(value) {
  if (value == null || value === "") return "";
  if (value instanceof Date && !Number.isNaN(value)) return localISO(value);
  if (typeof value === "number") {
    const d = XLSX.SSF.parse_date_code(value);
    if (!d) return "";
    return `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}`;
  }
  const text = String(value).trim();
  const parsed = new Date(text);
  if (!Number.isNaN(parsed)) return parsed.toISOString().slice(0, 10);
  return "";
}

function isoToDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function timeText(hour) {
  return `${String(hour).padStart(2, "0")}:00`;
}

function monthKey(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
}

function safeCellText(value) {
  return value == null ? "" : String(value).trim();
}

function findSheetName(workbook, lab) {
  if (lab === "204BP") return workbook.SheetNames.find((name) => name.includes("204") && name.includes("BPold"));
  return workbook.SheetNames.find((name) => name.includes("503"));
}

function readLabSheet(lab) {
  const sheetInfo = state.sheets[lab];
  sheetInfo.rows.clear();
  const sheet = state.workbook.Sheets[sheetInfo.name];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "" });

  rows.forEach((row, index) => {
    const iso = excelDateToISO(row[0]);
    if (!iso) return;
    const slots = hours.map((hour, i) => safeCellText(row[sheetInfo.slotStartCol + i]));
    sheetInfo.rows.set(iso, { rowIndex: index, slots });
  });
}

function isOriginalOccupied(lab, iso, hour) {
  const row = state.sheets[lab].rows.get(iso);
  if (!row) return true;
  return Boolean(row.slots[hour - 8]);
}

function bookingsForSlot(lab, iso, hour) {
  return state.bookings.filter((b) =>
    b.lab === lab &&
    b.date === iso &&
    b.startHour <= hour &&
    b.startHour + b.duration > hour
  );
}

function isSlotOccupied(lab, iso, hour) {
  return isOriginalOccupied(lab, iso, hour) || bookingsForSlot(lab, iso, hour).length > 0;
}

function isRangeAvailable(lab, iso, startHour, duration, ignoreId = null) {
  const row = state.sheets[lab].rows.get(iso);
  if (!row) return false;
  for (let hour = startHour; hour < startHour + duration; hour += 1) {
    if (hour < 8 || hour > 20 || isOriginalOccupied(lab, iso, hour)) return false;
  }
  return !state.bookings.some((b) =>
    b.id !== ignoreId &&
    b.lab === lab &&
    b.date === iso &&
    b.startHour < startHour + duration &&
    b.startHour + b.duration > startHour
  );
}

function initControls() {
  $("startHour").innerHTML = hours.slice(0, -1).map((h) => `<option value="${h}">${timeText(h)}</option>`).join("");
  $("monthPicker").value = monthKey();
  $("date").value = localISO(new Date());
}

function updateStatus() {
  $("fileName").textContent = state.fileName || "未导入";
  $("count204").textContent = state.sheets["204BP"].rows.size;
  $("count503").textContent = state.sheets["503"].rows.size;
  $("bookingCount").textContent = state.bookings.length;
}

function showImportError(message) {
  const el = $("importError");
  el.textContent = message || "";
  el.classList.toggle("show", Boolean(message));
}

function showEmpty(targetId) {
  $(targetId).innerHTML = $("emptyTemplate").innerHTML;
}

function monthDays(yyyyMm) {
  const [year, month] = yyyyMm.split("-").map(Number);
  const first = new Date(year, month - 1, 1);
  const start = new Date(first);
  start.setDate(first.getDate() - ((first.getDay() + 6) % 7));
  return Array.from({ length: 42 }, (_, i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    return d;
  });
}

function renderCalendar(targetId, renderDay) {
  const yyyyMm = $("monthPicker").value || monthKey();
  const days = monthDays(yyyyMm);
  const month = Number(yyyyMm.split("-")[1]) - 1;
  const header = weekNames.map((w) => `<div class="weekday">${w}</div>`).join("");
  const body = days.map((d) => {
    const iso = d.toISOString().slice(0, 10);
    const local = localISO(d);
    const outside = d.getMonth() !== month ? " outside" : "";
    return `<div class="day${outside}"><div class="date-num">${d.getDate()}</div>${outside ? "" : renderDay(local)}</div>`;
  }).join("");
  $(targetId).innerHTML = header + body;
}

function renderAvailability() {
  if (!state.workbook) return showEmpty("availabilityCalendar");
  const lab = $("viewLab").value === "all" ? "204BP" : $("viewLab").value;
  const duration = Number($("viewDuration").value);
  renderCalendar("availabilityCalendar", (iso) => {
    const options = [];
    for (let h = 8; h <= 21 - duration; h += 1) {
      if (isRangeAvailable(lab, iso, h, duration)) options.push(`<span class="slot">${timeText(h)}-${timeText(h + duration)}</span>`);
    }
    return options.length ? options.join("") : `<span class="blocked">无可约</span>`;
  });
}

function renderAppointments() {
  if (!state.workbook) return showEmpty("appointmentsCalendar");
  const lab = $("viewLab").value;
  renderCalendar("appointmentsCalendar", (iso) => {
    const items = state.bookings
      .filter((b) => b.date === iso && (lab === "all" || b.lab === lab))
      .sort((a, b) => a.startHour - b.startHour)
      .map((b) => `<span class="appt">${timeText(b.startHour)}-${timeText(b.startHour + b.duration)} ${b.lab} ${b.name}（${b.group}）</span>`);
    return items.length ? items.join("") : "";
  });
}

function renderMatrix() {
  if (!state.workbook) return showEmpty("matrixPreview");
  const lab = $("viewLab").value === "all" ? "204BP" : $("viewLab").value;
  const yyyyMm = $("monthPicker").value || monthKey();
  const rows = [...state.sheets[lab].rows.keys()].filter((iso) => iso.startsWith(yyyyMm)).sort();
  const head = `<thead><tr><th>日期</th>${hours.map((h) => `<th>${timeText(h)}-${timeText(h + 1)}</th>`).join("")}</tr></thead>`;
  const body = rows.map((iso) => {
    const cells = hours.map((h) => {
      const booking = bookingsForSlot(lab, iso, h)[0];
      const original = state.sheets[lab].rows.get(iso).slots[h - 8];
      const text = booking ? `${booking.name}(${booking.group})` : original;
      return `<td class="${text ? "occupied" : "available"}">${text || "可约"}</td>`;
    }).join("");
    return `<tr><th>${iso}</th>${cells}</tr>`;
  }).join("");
  $("matrixPreview").innerHTML = `<table>${head}<tbody>${body}</tbody></table>`;
}

function renderBookings() {
  const rows = state.bookings.map((b) => `
    <tr>
      <td>${b.name}</td><td>${b.group}</td><td>${b.lab}</td><td>${b.date}</td>
      <td>${timeText(b.startHour)}-${timeText(b.startHour + b.duration)}</td>
      <td>${b.age || ""} / ${b.gender || ""}${b.note ? " / " + b.note : ""}</td>
      <td><button class="linkish" data-delete="${b.id}" type="button">删除</button></td>
    </tr>
  `).join("");
  $("bookingRows").innerHTML = rows || `<tr><td colspan="7">暂无新增预约</td></tr>`;
  $("bookingRows").querySelectorAll("[data-delete]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.bookings = state.bookings.filter((b) => b.id !== btn.dataset.delete);
      renderAll();
    });
  });
}

function renderAll() {
  updateStatus();
  renderBookings();
  renderAvailability();
  renderAppointments();
  renderMatrix();
}

function currentBookingFromForm() {
  return {
    id: crypto.randomUUID(),
    name: $("name").value.trim(),
    group: $("group").value,
    age: $("age").value,
    gender: $("gender").value,
    lab: $("lab").value,
    date: $("date").value,
    startHour: Number($("startHour").value),
    duration: Number($("duration").value),
    note: $("note").value.trim(),
  };
}

function addBooking(event) {
  event.preventDefault();
  if (!state.workbook) {
    $("conflictText").textContent = "请先导入 Excel。";
    return;
  }
  const booking = currentBookingFromForm();
  if (!booking.name || !booking.date) return;
  if (!isRangeAvailable(booking.lab, booking.date, booking.startHour, booking.duration)) {
    $("conflictText").textContent = "该时间段已被占用，请换一个时间。";
    return;
  }
  $("conflictText").textContent = "";
  state.bookings.push(booking);
  $("bookingForm").reset();
  $("date").value = booking.date;
  renderAll();
}

async function loadWorkbook(file) {
  try {
    showImportError("");
    if (!window.XLSX) {
      showImportError("Excel 解析库没有加载成功。请确认设备能访问网络，或使用离线版 index.html。");
      return;
    }
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, { type: "array", cellDates: true });
    const sheet204 = findSheetName(workbook, "204BP") || "";
    const sheet503 = findSheetName(workbook, "503") || "";
    if (!sheet204 || !sheet503) {
      showImportError(`没有找到 204(BPold) 或 503 工作表。当前文件包含：${workbook.SheetNames.join("、")}`);
      return;
    }
    state.workbook = workbook;
    state.fileName = file.name;
    state.sheets["204BP"].name = sheet204;
    state.sheets["503"].name = sheet503;
    readLabSheet("204BP");
    readLabSheet("503");
    const todayMonth = monthKey();
    const knownMonths = new Set([...state.sheets["204BP"].rows.keys(), ...state.sheets["503"].rows.keys()].map((iso) => iso.slice(0, 7)));
    if (knownMonths.has(todayMonth)) $("monthPicker").value = todayMonth;
    renderAll();
  } catch (error) {
    console.error(error);
    showImportError(`Excel 导入失败：${error.message || error}`);
  }
}

function exportBookingsCsv() {
  const rows = [["姓名","分组","年龄","性别","实验室","日期","开始时间","时长(小时)","结束时间","备注/联系方式"]];
  state.bookings.forEach((b) => rows.push([b.name, b.group, b.age, b.gender, b.lab, b.date, timeText(b.startHour), b.duration, timeText(b.startHour + b.duration), b.note]));
  const csv = "\ufeff" + rows.map((row) => row.map((v) => `"${String(v ?? "").replaceAll('"', '""')}"`).join(",")).join("\n");
  downloadBlob(csv, "被试预约信息.csv", "text/csv;charset=utf-8");
}

function exportUpdatedWorkbook() {
  if (!state.workbook) return;
  const wb = XLSX.utils.book_new();
  state.workbook.SheetNames.forEach((name) => {
    const ws = state.workbook.Sheets[name];
    const cloned = structuredClone(ws);
    XLSX.utils.book_append_sheet(wb, cloned, name);
  });
  state.bookings.forEach((b) => {
    const info = state.sheets[b.lab];
    const ws = wb.Sheets[info.name];
    const sourceRow = info.rows.get(b.date);
    if (!sourceRow) return;
    for (let h = b.startHour; h < b.startHour + b.duration; h += 1) {
      const address = XLSX.utils.encode_cell({ r: sourceRow.rowIndex, c: info.slotStartCol + (h - 8) });
      ws[address] = { t: "s", v: `${b.name}(${b.group})` };
    }
  });
  const exportRows = state.bookings.map((b, index) => ({
    预约ID: index + 1,
    被试姓名: b.name,
    分组: b.group,
    年龄: b.age,
    性别: b.gender,
    实验室: b.lab,
    日期: b.date,
    开始时间: timeText(b.startHour),
    "时长(小时)": b.duration,
    结束时间: timeText(b.startHour + b.duration),
    "联系方式/备注": b.note,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(exportRows), "导出_被试预约信息");
  XLSX.writeFile(wb, "实验室预约表_更新后.xlsx");
}

function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function bindEvents() {
  $("fileInput").addEventListener("change", (e) => {
    const file = e.target.files?.[0];
    if (file) loadWorkbook(file);
  });
  $("bookingForm").addEventListener("submit", addBooking);
  $("exportBookings").addEventListener("click", exportBookingsCsv);
  $("exportWorkbook").addEventListener("click", exportUpdatedWorkbook);
  $("clearBookings").addEventListener("click", () => {
    state.bookings = [];
    renderAll();
  });
  ["monthPicker", "viewLab", "viewDuration"].forEach((id) => $(id).addEventListener("change", renderAll));
  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab, .tab-panel").forEach((el) => el.classList.remove("active"));
      tab.classList.add("active");
      $(tab.dataset.tab).classList.add("active");
      $("viewDurationWrap").style.display = tab.dataset.tab === "availability" ? "grid" : "none";
      renderAll();
    });
  });
}

initControls();
bindEvents();
renderAll();

</script>
</body>
</html>
